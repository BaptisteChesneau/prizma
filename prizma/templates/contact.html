<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Prizma</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    {% include 'header.html' %}

    <main class="contact">
      <section class="contact-wrap card" aria-labelledby="contact-title">
        <h1 id="contact-title" class="contact-title">Nous contacter</h1>
        <p class="contact-sub">Remplis le formulaire ci-dessous, on te répond vite.</p>

        <div class="contact-embed">
          <!-- Tally embed -->
          <iframe
            data-tally-src="https://tally.so/embed/n022LB?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            width="100%"
            height="409"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="Prizma - Nous contacter"></iframe>

          <script>
            var d=document,w="https://tally.so/widgets/embed.js",v=function(){
              if(typeof Tally!=="undefined"){Tally.loadEmbeds();}
              else{d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})}
            };
            if(typeof Tally!=="undefined") v();
            else if(d.querySelector('script[src="'+w+'"]')==null){
              var s=d.createElement("script"); s.src=w; s.onload=v; s.onerror=v; d.body.appendChild(s);
            }
          </script>
        </div>
      </section>
    </main>

    {% include 'footer.html' %}
  </body>
</html>
